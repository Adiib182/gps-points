<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Pramuka Square - Member Rewards</title>
  <style>
    :root { --primary: #2e7d32; --accent: #ffb300; --bg: #f1f8e9; }
    body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 450px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    /* Branding & Logo */
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-logo { 
      width: 100%; 
      max-width: 180px; 
      height: auto; 
      margin-bottom: 10px; 
      border-radius: 8px; 
    }
    .brand-header h4 { color: var(--primary); font-weight: 800; margin: 0; letter-spacing: 0.5px; }
    
    /* Auto Promo Banner Section */
    .promo-section { margin: 15px 0 25px 0; position: relative; }
    .promo-title { font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    
    /* Pembungkus slider luar */
    .slider-wrapper { width: 100%; overflow: hidden; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* Jalur geser dalam */
    .promo-container { display: flex; transition: transform 0.5s ease-in-out; width: 100%; }
    
    /* Tiap banner promo */
    .promo-card { 
      flex: 0 0 100%; 
      background: #fff8e1; 
      border-left: 5px solid var(--accent); 
      box-sizing: border-box; 
      height: 140px; 
      overflow: hidden;
      padding: 0; 
      cursor: pointer; /* Mengubah kursor menjadi jari penunjuk saat banner didekati */
    }
    
    /* Proteksi Gambar */
    .promo-card img {
      width: 100%;
      height: 100%;
      object-fit: fill; 
      display: block;
    }
    
    /* Titik Indikator di Bawah Banner */
    .slider-dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
    .dot { width: 8px; height: 8px; background: #ccc; border-radius: 50%; transition: 0.3s; }
    .dot.active { background: var(--primary); width: 18px; border-radius: 4px; }

    /* Input & Buttons */
    .input-group { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-gps { background: var(--primary); color: white; }
    
    /* Member Dashboard */
    .hero { background: linear-gradient(135deg, var(--primary), #4caf50); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -20px; bottom: -20px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    .poin-text { font-size: 2.5rem; font-weight: bold; margin: 5px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    
    /* Catalog */
    .hadiah-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
    .btn-tukar { background: var(--accent); color: #333; }
    .btn-disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }
    .hidden { display: none; }
    
    /* Modal PIN & MODAL IMAGE PREVIEW */
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
    .modal-content { background: white; margin: 20% auto; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; animation: slideDown 0.3s ease-out; }
    
    /* Gaya Khusus untuk Pop-up Pembesar Gambar */
    .image-modal-content {
      background: transparent;
      margin: 15% auto;
      padding: 0;
      width: 90%;
      max-width: 400px;
      text-align: center;
      position: relative;
      animation: zoomIn 0.3s ease-out;
    }
    .image-modal-content img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    }
    .close-image-modal {
      position: absolute;
      top: -35px;
      right: 5px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #eee; border-radius: 10px; text-align: center; font-size: 1.5rem; letter-spacing: 8px; box-sizing: border-box; outline: none; }
    .modal-input:focus { border-color: var(--primary); }
    .btn-confirm { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-cancel { margin-top: 15px; color: #888; font-size: 0.85rem; cursor: pointer; display: inline-block; text-decoration: underline; }
    
    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div class="brand-header">
        <img class="brand-logo" src="https://lh3.googleusercontent.com/d/1yaJ4_M5pgRzScZ15zTftx5mohre74atX" alt="Logo GPS">
        <h4>The Place for Every Taste & Hangout</h4>
      </div>
      
      <div class="input-group" id="loginSection">
        <input type="text" id="idCek" placeholder="Masukkan No HP...">
        <button class="btn btn-gps" id="btnCek" onclick="loadDashboard()">Cek</button>
      </div>

      <div class="promo-section">
        <div class="promo-title"><span>📢</span> Promo & Info Spesial Untukmu</div>
        
        <div class="slider-wrapper">
          <div class="promo-container" id="promoContainer">
            
            <div class="promo-card" style="border: none;" onclick="perbesarBanner(this)">
              <img src="https://i.ibb.co.com/WXgJhNB/2.jpg" alt="Promo 1">
            </div>
            
            <div class="promo-card" style="border: none;" onclick="perbesarBanner(this)">
              <img src="https://i.ibb.co.com/WXgJhNB/2.jpg" alt="Promo 2">
            </div>

            <div class="promo-card" style="border: none;" onclick="perbesarBanner(this)">
              <img src="https://i.ibb.co.com/WXgJhNB/2.jpg" alt="Promo 3">
            </div>

          </div>
        </div>
        
        <div class="slider-dots" id="sliderDots"></div>
      </div>

      <div id="dashboard" class="hidden">
        <div class="hero">
          <h6 id="namaCust" style="margin:0; font-size: 1rem; letter-spacing: 0.5px;">-</h6>
          <div class="poin-text" id="poinCust">0</div>
          <p style="margin:0; opacity: 0.9; font-size: 0.9rem;">Green Points</p>
        </div>

        <h5 style="margin-bottom:10px; font-weight: bold; color: #444;">Katalog Hadiah</h5>
        <div id="listHadiah"></div>
      </div>
      
      <div style="text-align:center; margin-top:20px;">
        <p id="linkDaftar"><a href="registrasi.html" style="color:var(--primary); font-weight: 600; text-decoration: none;">Belum punya akun? Daftar Sekarang</a></p>
        <button id="btnCekLain" class="btn btn-gps hidden" style="background:#6c757d" onclick="resetDashboard()">« Cek Nomor Lain</button>
      </div>
    </div>
  </div>

  <div id="pinModal" class="modal">
    <div class="modal-content">
      <h3 style="margin:0; color:var(--primary);">Konfirmasi PIN</h3>
      <p style="font-size:0.85rem; color:#666;">Silakan masukkan PIN transaksi Anda</p>
      <input type="password" id="pinInputan" class="modal-input" maxlength="6" inputmode="numeric" placeholder="•••••">
      <button id="btnKonfirmasi" class="btn-confirm" onclick="eksekusiTukar()">TUKAR SEKARANG</button>
      <div class="btn-cancel" onclick="tutupModal()">Batalkan</div>
    </div>
  </div>

  <div id="imageModal" class="modal" onclick="tutupPreviewBanner()">
    <div class="image-modal-content" onclick="event.stopPropagation()">
      <span class="close-image-modal" onclick="tutupPreviewBanner()">&times;</span>
      <img id="imgPreviewTarget" src="" alt="Preview Banner">
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJ_A34WEQOnHTfWYZzcnZmyK1fbrnUgcfRFB0GBRRjpYtG0n_vq1lFDN4TbV_G3o76eA/exec";
    let memberIdTemp = "";
    let hadiahTemp = "";
    let currentPoinUser = 0;
    
    let intervalPromo;
    let indeksPromoSekarang = 0;

    document.addEventListener("DOMContentLoaded", function() {
      inisialisasiAutoSlide();
    });

    /* ==================== FUNGSI BARU UNTUK MODAL BANNER ==================== */
    function perbesarBanner(element) {
      const srcGambar = element.querySelector('img').src;
      document.getElementById('imgPreviewTarget').src = srcGambar;
      document.getElementById('imageModal').style.display = 'block';
    }

    function tutupPreviewBanner() {
      document.getElementById('imageModal').style.display = 'none';
    }
    /* ======================================================================== */

    function resetDashboard() {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('linkDaftar').classList.remove('hidden');
      document.getElementById('btnCekLain').classList.add('hidden');
      document.getElementById('idCek').value = "";
    }

    function panggilJSONP(url, namaCallback) {
      const scriptLama = document.getElementById('jsonp-script');
      if (scriptLama) scriptLama.remove();
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${url}&prefix=${namaCallback}&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }
    
    function loadDashboard() {
      const id = document.getElementById('idCek').value;
      if(!id) return alert("Silakan masukkan nomor HP.");
      
      const btnCek = document.getElementById('btnCek');
      btnCek.innerText = "Memuat...";
      btnCek.disabled = true;

      memberIdTemp = id;
      panggilJSONP(`${API_URL}?action=cekPoin&id=${id}`, "callbackCekPoin");
    }

    window.callbackCekPoin = function(res) {
      const btnCek = document.getElementById('btnCek');
      btnCek.innerText = "Cek";
      btnCek.disabled = false;

      if(res.status === "success") {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('linkDaftar').classList.add('hidden');
        document.getElementById('btnCekLain').classList.remove('hidden');
        document.getElementById('namaCust').innerText = res.data.nama;
        document.getElementById('poinCust').innerText = res.data.poin;
        currentPoinUser = res.data.poin;
        
        panggilJSONP(`${API_URL}?action=getKatalog`, "callbackKatalog");
      } else {
        alert(res.message || "Member tidak ditemukan.");
      }
    };

    function inisialisasiAutoSlide() {
      const container = document.getElementById('promoContainer');
      const dotsContainer = document.getElementById('sliderDots');
      const totalPromo = container.children.length;
      
      indeksPromoSekarang = 0;
      container.style.transform = `translateX(0%)`;
      dotsContainer.innerHTML = "";
      clearInterval(intervalPromo);

      if (totalPromo <= 1) return;

      for (let i = 0; i < totalPromo; i++) {
        const dot = document.createElement('div');
        dot.className = `dot ${i === 0 ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      }

      intervalPromo = setInterval(() => {
        indeksPromoSekarang = (indeksPromoSekarang + 1) % totalPromo;
        container.style.transform = `translateX(-${indeksPromoSekarang * 100}%)`;
        
        const dots = dotsContainer.children;
        for (let j = 0; j < dots.length; j++) {
          dots[j].classList.toggle('active', j === indeksPromoSekarang);
        }
      }, 4000); 
    }

    window.callbackKatalog = function(res) {
      if (res.status === "success") {
        const container = document.getElementById('listHadiah');
        container.innerHTML = "";
        
        res.data.forEach(item => {
          const bisa = currentPoinUser >= item.poin;
          container.innerHTML += `<div class="hadiah-item">
            <div><strong>${item.nama}</strong><br><small style="color:#666">${item.poin} Poin</small></div>
            <button class="btn ${bisa ? 'btn-tukar' : 'btn-disabled'}" ${bisa ? `onclick="tukar('${memberIdTemp}', '${item.nama}')"` : 'disabled'}>
              ${bisa ? 'Tukar' : 'Poin Kurang'}
            </button>
          </div>`;
        });
      }
    };

    function tukar(id, h) { 
      memberIdTemp = id;
      hadiahTemp = h;
      document.getElementById('pinModal').style.display = 'block';
      document.getElementById('pinInputan').value = "";
      document.getElementById('pinInputan').focus();
    }

    function tutupModal() {
      document.getElementById('pinModal').style.display = 'none';
    }

    function eksekusiTukar() {
      const pin = document.getElementById('pinInputan').value;
      if(!pin) return alert("PIN wajib diisi!");

      const btn = document.getElementById('btnKonfirmasi');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const encodeHadiah = encodeURIComponent(hadiahTemp);
      panggilJSONP(`${API_URL}?action=tukarPoin&id=${memberIdTemp}&namaHadiah=${encodeHadiah}&pinInput=${pin}`, "callbackTukar");
    }

    window.callbackTukar = function(res) {
      const btn = document.getElementById('btnKonfirmasi');
      btn.innerText = "TUKAR SEKARANG";
      btn.disabled = false;

      alert(res.message);
      if (res.status === "success") {
        tutupModal();
        loadDashboard(); 
      }
    };
  </script>
</body>
</html>
