<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Input Poin GPS</title>
  <style>
    :root { --primary: #2e7d32; --bg: #f8f9fa; }
    body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 400px; margin: 20px auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h4 { color: var(--primary); text-align: center; margin-bottom: 5px; }
    .nav-rekap { text-align: center; margin-bottom: 20px; }
    .btn-rekap { background: #ff9800; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-block; transition: 0.3s; }
    label { font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn:disabled { background: #a5d6a7; cursor: not-allowed; }
    #login-screen { display: block; }
    #admin-content { display: none; }
    .error-msg { color: red; font-size: 0.8rem; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="login-screen" class="card">
      <h4>LOGIN ADMIN</h4>
      <p style="text-align:center; font-size:0.8rem; color:#777;">Masukkan kunci akses untuk masuk ke sistem</p>
      <div id="error-login" class="error-msg"></div>
      <label>Password:</label>
      <input type="password" id="pass-awal" placeholder="Password Admin">
      <button class="btn" onclick="verifikasiLogin()">MASUK</button>
    </div>

    <div id="admin-content" class="card">
      <h4>INPUT POIN - GPS</h4>
      
      <div class="nav-rekap">
        <a href="rekap.html" class="btn-rekap">Lihat Rekap Penukaran »</a>
      </div>
      
      <input type="hidden" id="pass">
      
      <label>Nomor HP Member:</label>
      <input type="text" id="idS" placeholder="Contoh: 8123456789">
      
      <label>Total Belanja (Rp):</label>
      <input type="text" id="nom" placeholder="Contoh: 150.000" onkeyup="formatRibuan(this)">
      
      <button id="btnSubmit" class="btn" onclick="addPoin()">TAMBAH POIN</button>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="color:#777; text-decoration:none; font-size: 0.9rem;">« Kembali ke Menu Utama</a>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJ_A34WEQOnHTfWYZzcnZmyK1fbrnUgcfRFB0GBRRjpYtG0n_vq1lFDN4TbV_G3o76eA/exec";
    const PASSWORD_AKSES = "123"; 

    function verifikasiLogin() {
      const input = document.getElementById('pass-awal').value;
      const errorDiv = document.getElementById('error-login');
      
      if(input === PASSWORD_AKSES) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        document.getElementById('pass').value = input;
      } else {
        errorDiv.innerText = "Password salah! Akses ditolak.";
      }
    }

    function formatRibuan(input) {
      let value = input.value.replace(/\D/g, "");
      input.value = value ? new Intl.NumberFormat('id-ID').format(value) : "";
    }

    async function addPoin() {
      const p = document.getElementById('pass').value;
      const i = document.getElementById('idS').value;
      const rawNom = document.getElementById('nom').value;
      const n = parseInt(rawNom.replace(/\./g, ""));
      
      if(!i || !n || !p) return alert("Harap isi semua kolom dengan benar!");
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}?action=tambahPoinOtomatis&pass=${p}&id=${i}&totalBelanja=${n}`);
        const res = await response.json();

        if (res.status === "success") {
          alert(res.message);
          document.getElementById('nom').value = "";
          document.getElementById('idS').value = "";
        } else {
          alert(res.message || "Gagal menambah poin.");
        }
      } catch (error) {
        alert("Terjadi error koneksi ke server backend.");
      } finally {
        btn.innerText = "TAMBAH POIN";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
