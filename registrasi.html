<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Member GPS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --primary: #2e7d32; --bg: #f8f9fa; }
    body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 400px; margin: 20px auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h4 { color: var(--primary); text-align: center; margin-bottom: 5px; }
    p { color: #666; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
    label { font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
    .btn-main { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-main:disabled { background: #a5d6a7; }
    .btn-link { width: 100%; padding: 10px; background: none; border: none; color: #777; cursor: pointer; font-size: 0.9rem; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h4>Daftar Member GPS</h4>
      <p>Dapatkan 1 poin setiap belanja kelipatan Rp 10.000</p>
      
      <label>Nama Lengkap:</label>
      <input type="text" id="regNama" placeholder="Contoh: Budi Santoso">
      
      <label>Nomor WhatsApp:</label>
      <input type="number" id="regHP" placeholder="Contoh: 8123456789">

      <label>Buat PIN Transaksi (6 Digit):</label>
      <input type="password" id="regPIN" maxlength="6" inputmode="numeric" placeholder="Contoh: 123456">
      <small style="display:block; color:#888; margin-top:-10px; margin-bottom:15px; font-size:0.7rem;">*PIN ini digunakan saat menukar hadiah.</small>
      
      <button id="btnDaftar" class="btn-main" onclick="daftar()">GABUNG SEKARANG</button>
      <a href="index.html" class="btn-link">Batal / Kembali</a>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJ_A34WEQOnHTfWYZzcnZmyK1fbrnUgcfRFB0GBRRjpYtG0n_vq1lFDN4TbV_G3o76eA/exec";

    // Fungsi Pembantu JSONP untuk menembus CORS Browser secara sempurna
    function panggilJSONP(url, namaCallback) {
      const scriptLama = document.getElementById('jsonp-script');
      if (scriptLama) scriptLama.remove();
      
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${url}&prefix=${namaCallback}&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function daftar() {
      const n = document.getElementById('regNama').value;
      const h = document.getElementById('regHP').value;
      const p = document.getElementById('regPIN').value;
      const btn = document.getElementById('btnDaftar');
      
      if(!n || !h || !p) return alert("Lengkapi semua data termasuk PIN!");
      if(p.length < 4) return alert("PIN minimal 4 - 6 digit!");
      
      btn.innerText = "Memproses...";
      btn.disabled = true;

      // Kirim request ke GAS menggunakan sistem JSONP callback
      const targetUrl = `${API_URL}?action=daftarMember&nama=${encodeURIComponent(n)}&noHP=${h}&pin=${p}`;
      panggilJSONP(targetUrl, "callbackDaftar");
    }

    // Fungsi penangkap respon sukses/gagal dari Code.gs
    window.callbackDaftar = function(res) {
      const btn = document.getElementById('btnDaftar');
      btn.innerText = "GABUNG SEKARANG";
      btn.disabled = false;

      if (res.status === "success") {
        alert(res.message || "Pendaftaran Berhasil!");
        window.location.href = "index.html"; // Kembali ke halaman login utama
      } else {
        alert(res.message || "Pendaftaran gagal!");
      }
    };
  // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker berhasil didaftarkan dengan scope: ', registration.scope);
          })
          .catch(err => {
            console.log('Pendaftaran ServiceWorker gagal: ', err);
          });
      });
    }
  </script>
</body>
</html>
