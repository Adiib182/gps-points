<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panel Manajemen</title>
  <style>
    :root { --primary: #ff9800; --bg: #f8f9fa; }
    body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: #333; margin: 0; padding: 15px; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h4 { color: #e65100; text-align: center; margin-bottom: 20px; }
    
    /* Tabs System */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 8px; font-weight: bold; cursor: pointer; color: #555; }
    .tab-btn.active { background: #e65100; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Forms & Tables */
    .search-container { margin-bottom: 15px; display: flex; gap: 8px; }
    input[type="text"], input[type="number"], input[type="password"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-submit { background: #ff9800; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { background: #fff3e0; color: #e65100; padding: 12px 8px; border-bottom: 2px solid #ffcc80; text-align: left; }
    td { padding: 12px 8px; border-bottom: 1px solid #eee; }
    
    /* Badges & Action Buttons */
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    .sudah { background: #e8f5e9; color: #2e7d32; }
    .btn-action { background: #2e7d32; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-edit { background: #1976d2; }
    .btn-delete { background: #d32f2f; }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
    .btn-nav { background: #eee; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #login-rekap { display: block; }
    #main-panel { display: none; }
    #loading-text { text-align: center; font-weight: bold; color: #666; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="container">
    <div id="login-rekap" class="card">
      <h4>AKSES PANEL ADMIN</h4>
      <input type="password" id="pass-rekap" placeholder="Masukkan Password">
      <button onclick="cekLoginRekap()" style="width:100%; padding:12px; background:#e65100; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">MASUK</button>
      <p id="err" style="color:red; text-align:center; font-size:0.8rem;"></p>
    </div>

    <div id="main-panel">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('rekap')">Rekap Penukaran</button>
        <button class="tab-btn" onclick="switchTab('katalog')">Kelola Hadiah</button>
      </div>

      <div id="loading-text" style="display: none;">Memproses data...</div>

      <div id="tab-rekap" class="tab-content active card">
        <h4>REKAP PENUKARAN HADIAH</h4>
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Cari ID Member / No HP..." onkeyup="filterData()">
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Member</th>
                <th>Hadiah</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="prevBtn" class="btn-nav" onclick="changePage(-1)">« Prev</button>
          <span id="pageInfo">Hal 1</span>
          <button id="nextBtn" class="btn-nav" onclick="changePage(1)">Next »</button>
        </div>
      </div>

      <div id="tab-katalog" class="tab-content card">
        <h4>KELOLA KATALOG HADIAH</h4>
        
        <div class="form-group" style="background:#fff3e0; padding:15px; border-radius:8px; flex-wrap:wrap;">
          <input type="text" id="input-nama" placeholder="Nama Hadiah Baru" style="flex:100%; margin-bottom:5px;">
          <input type="number" id="input-poin" placeholder="Poin" style="flex:1;">
          <input type="number" id="input-stok" placeholder="Stok" style="flex:1;">
          <button class="btn-submit" onclick="tambahHadiah()">Tambah</button>
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Nama Hadiah</th>
                <th>Poin</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-katalog"></tbody>
          </table>
        </div>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="admin-page.html" style="color:#777; text-decoration:none; font-size: 0.9rem;">« Kembali ke Input Poin</a>
      </div>
    </div>
  </div>

  <script>
    // GANTI URL INI DENGAN URL DEPLOYMENT BARU ANDA!
    const API_URL = "https://script.google.com/macros/s/AKfycbyJ_A34WEQOnHTfWYZzcnZmyK1fbrnUgcfRFB0GBRRjpYtG0n_vq1lFDN4TbV_G3o76eA/exec";
    const PASS_BENAR = "123";
    let globalPassword = "";
    
    // Variabel Rekap
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 10;

    // Utilitas JSONP
    function panggilJSONP(url, namaCallback) {
      const scriptLama = document.getElementById('jsonp-script-' + namaCallback);
      if (scriptLama) scriptLama.remove();
      const script = document.createElement('script');
      script.id = 'jsonp-script-' + namaCallback;
      script.src = `${url}&prefix=${namaCallback}&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function toggleLoading(show) {
      document.getElementById('loading-text').style.display = show ? "block" : "none";
    }

    // --- SISTEM LOGIN & TABS ---
    function cekLoginRekap() {
      const pass = document.getElementById('pass-rekap').value;
      if(pass === PASS_BENAR) {
        globalPassword = pass;
        document.getElementById('login-rekap').style.display = 'none';
        document.getElementById('main-panel').style.display = 'block';
        loadDataRekap();
        loadDataKatalog();
      } else {
        document.getElementById('err').innerText = "Password Salah!";
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
    }

    // =====================================
    // FITUR 1: REKAP PENUKARAN (Lama)
    // =====================================
    function loadDataRekap() {
      toggleLoading(true);
      panggilJSONP(`${API_URL}?action=getLogTransaksi`, "cbLoadRekap");
    }

    window.cbLoadRekap = function(res) {
      toggleLoading(false);
      if (res.status === "success") {
        allData = res.data;
        filterData();
      }
    };

    function filterData() {
      const search = document.getElementById('search-input').value.toLowerCase();
      filteredData = allData.filter(item => item[2].toString().toLowerCase().includes(search));
      currentPage = 1;
      renderTabel();
    }

    function renderTabel() {
      const tbody = document.getElementById('tabel-body');
      const start = (currentPage - 1) * rowsPerPage;
      const paginatedItems = filteredData.slice(start, start + rowsPerPage);

      if (paginatedItems.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>Data tidak ditemukan.</td></tr>";
        updateNav();
        return;
      }

      let html = "";
      paginatedItems.forEach(item => {
        let aksi = item[4] === "BELUM DIAMBIL" 
          ? `<button class="btn-action" onclick="tandaiSelesai(${item[0]}, this)">Selesai</button>` 
          : `<span class="status-badge sudah">DIAMBIL</span>`;
        html += `<tr><td>${item[1]}</td><td>${item[2]}</td><td>${item[3].replace("Tukar Hadiah: ", "")}</td><td>${aksi}</td></tr>`;
      });
      tbody.innerHTML = html;
      updateNav();
    }

    function updateNav() {
      const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
      document.getElementById('pageInfo').innerText = `Hal ${currentPage} dari ${totalPages}`;
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage === totalPages);
    }

    function changePage(dir) { currentPage += dir; renderTabel(); }

    function tandaiSelesai(baris, btn) {
      if(!confirm("Sudah diberikan?")) return;
      btn.innerText = "..."; btn.disabled = true;
      panggilJSONP(`${API_URL}?action=tandaiHadiahDiberikan&rowIdx=${baris}`, "cbSelesai");
    }

    window.cbSelesai = function(res) {
      alert(res.message);
      if (res.status === "success") loadDataRekap(); 
    };

    // =====================================
    // FITUR 2: MANAJEMEN HADIAH (Baru)
    // =====================================
    function loadDataKatalog() {
      toggleLoading(true);
      panggilJSONP(`${API_URL}?action=getKatalog`, "cbLoadKatalog");
    }

    window.cbLoadKatalog = function(res) {
      toggleLoading(false);
      const tbody = document.getElementById('tabel-katalog');
      if (res.status === "success") {
        let html = "";
        res.data.forEach(item => {
          html += `<tr>
            <td>${item.nama}</td>
            <td>${item.poin}</td>
            <td>${item.stok}</td>
            <td>
              <button class="btn-action btn-edit" onclick="editHadiah('${item.nama}', ${item.poin}, ${item.stok})">Edit</button>
              <button class="btn-action btn-delete" onclick="hapusHadiah('${item.nama}')">X</button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html || "<tr><td colspan='4' style='text-align:center'>Katalog kosong.</td></tr>";
      }
    };

    function tambahHadiah() {
      const nama = document.getElementById('input-nama').value;
      const poin = document.getElementById('input-poin').value;
      const stok = document.getElementById('input-stok').value;
      
      if(!nama || !poin || !stok) { alert("Isi semua data hadiah!"); return; }
      
      toggleLoading(true);
      panggilJSONP(`${API_URL}?action=tambahHadiah&pass=${globalPassword}&nama=${encodeURIComponent(nama)}&poin=${poin}&stok=${stok}`, "cbKatalogAksi");
    }

    function editHadiah(namaLama, poinLama, stokLama) {
      const namaBaru = prompt("Edit Nama Hadiah:", namaLama);
      if (namaBaru === null) return;
      const poinBaru = prompt("Edit Poin yang dibutuhkan:", poinLama);
      if (poinBaru === null) return;
      const stokBaru = prompt("Edit Sisa Stok:", stokLama);
      if (stokBaru === null) return;

      toggleLoading(true);
      panggilJSONP(`${API_URL}?action=editHadiah&pass=${globalPassword}&namaLama=${encodeURIComponent(namaLama)}&namaBaru=${encodeURIComponent(namaBaru)}&poin=${poinBaru}&stok=${stokBaru}`, "cbKatalogAksi");
    }

    function hapusHadiah(nama) {
      if(!confirm(`Yakin ingin menghapus hadiah "${nama}"?`)) return;
      toggleLoading(true);
      panggilJSONP(`${API_URL}?action=hapusHadiah&pass=${globalPassword}&nama=${encodeURIComponent(nama)}`, "cbKatalogAksi");
    }

    window.cbKatalogAksi = function(res) {
      toggleLoading(false);
      alert(res.message);
      if (res.status === "success") {
        document.getElementById('input-nama').value = "";
        document.getElementById('input-poin').value = "";
        document.getElementById('input-stok').value = "";
        loadDataKatalog();
      }
    };
  </script>
</body>
</html>
